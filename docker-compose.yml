services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snaf_organigrama
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=snaf-super-secret-key-coolify-production-change-me
      - DEBUG=False
      - ALLOWED_HOSTS=*,organigrama.secnaf.jujuy.gob.ar,45.186.124.153
      - CSRF_TRUSTED_ORIGINS=https://organigrama.secnaf.jujuy.gob.ar http://organigrama.secnaf.jujuy.gob.ar http://45.186.124.153 https://45.186.124.153
      - DATA_DIR=/app/data
    volumes:
      - organigrama_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  organigrama_data:
    name: snaf_organigrama_data
